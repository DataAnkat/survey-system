<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kysely</title>
</head>

<body>

    <h1>Kyselypohja</h1>

    <form th:action="@{/saveSurvey}" method="post">
        
        
        <table>
            <tr>
                <td><label for="name">Kyselyn nimi: </label></td>
                <td><input size="100" id="name" name="name" type="text" required/></td>
            </tr>

            <tr>
                <td><label for="kuvaus">Kuvaus: </label></td>
                <td><input size="100" id="name" name="name" type="text" required/></td>
            </tr>

        </table>
        

        <table id="questions">
            <tr>
                <td><label>Kysymys: </label></td>
                <td><input size="100" name="questions[0]" type="text" required/></td>
                
            </tr>
        </table>

        <button type="button" onclick="addQuestion()">Lisää kysymys</button>
        <button type="submit">Tallenna</button>
    </form>

    <a href="/surveyList">Takaisin</a>

    <script>
        function addQuestion() {
            const table = document.getElementById("questions");
            const index = table.rows.length;
            const row = table.insertRow();
            row.innerHTML = '<td><label>Kysymys: </label></td>'
                + '<td><input name="questions[' + index + ']" type="text" required/></td>';
        }
    </script>

</body>

</html>
