<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muokkaa Kyselyä</title>
    
    <style>
        textarea {
            width: 100%;
            min-width: 400px;
            min-height: 30px;
            box-sizing: border-box;
            overflow: hidden;
            resize: none; 
            font-family: inherit;
            padding: 5px;
        }
    </style>
</head>

<body>

    <h1>Muokkaa kyselyä</h1>

    <form th:action="@{/saveSurvey}" th:object="${survey}" method="post">
        
        <input type="hidden" th:field="*{id}" />
        
        <table>
            <tr>
                <td><label for="name">Kyselyn nimi: </label></td>

                <td><textarea id="name" th:field="*{name}" oninput="autoResize(this)" required></textarea></td>
            </tr>

            <tr>
                <td><label for="description">Kuvaus: </label></td>
                <td><textarea id="description" th:field="*{description}" oninput="autoResize(this)" required></textarea></td>
            </tr>

        </table>
        
        <table id="questions">
            <tr th:each="question, stat : *{questions}">
                <td><label>Kysymys: </label></td>
                <td><textarea th:field="*{questions[__${stat.index}__]}" oninput="autoResize(this)" required></textarea></td>
            </tr>
        </table>

        <br>
        <button type="button" onclick="addQuestion()">Lisää kysymys</button>
        <button type="submit">Tallenna</button>
    </form>

    <br>
    <a class="btn btn-success" href="/surveyList">Takaisin</a>

    <script>

        function autoResize(element) {
            element.style.height = 'auto';
            element.style.height = element.scrollHeight + 'px';
        }

        document.addEventListener("DOMContentLoaded", function() {
            const textareas = document.querySelectorAll("textarea");
            textareas.forEach(textarea => autoResize(textarea));
        });

        function addQuestion() {
            const table = document.getElementById("questions");
            const index = table.rows.length;
            const row = table.insertRow();
            row.innerHTML = '<td><label>Kysymys: </label></td>'
                + '<td><textarea name="questions[' + index + ']" oninput="autoResize(this)" required></textarea></td>';
        }
    </script>

</body>

</html>
