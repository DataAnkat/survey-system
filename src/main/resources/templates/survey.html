<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kysely</title>
</head>

<body>

    <h1 th:text="${survey.name}">Kysely</h1>
    <td th:text="${survey.description}" style="font-size: 20px;">testaus</td>

    <!-- foreach kysymys  -->

    <ol>
        <li th:each="question : ${questions}">
            <td th:text="${question.question}"></td>
        </li>
    </ol>
    <!-- New Edit Button-->
     <a class="btn btn-primary" th:href="@{/editSurvey/{id}(id=${survey.id})}">Muokkaa</a>

    <a class="btn btn-success" href="/surveyList">Takaisin</a>
</body>
</html>
