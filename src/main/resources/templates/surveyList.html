<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kysely</title>
</head>

<body>

    <h1>Kyselyt</h1>

    <!-- foreach kysymys  -->

    <table>
        <tr th:each="survey : ${Surveys}">
            <td><a th:text="${survey.name}" th:href="@{/survey/{id}(id=${survey.id})}"></a></td>
            <!-- New Edit Button-->
            <td><a th:href="@{/editSurvey/{id}(id=${survey.id})}">Muokkaa</a></td>
            <!-- New Delete Button-->
            <td><a th:href="@{/deleteSurvey/{id}(id=${survey.id})}">Poista</a></td>
        </tr>
    </table>
     

    <!-- <button>Luo kysely nappi</button> -->
    <a class="btn btn-success" href="/createSurvey">Add</a>

</body>
</html>
